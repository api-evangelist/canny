openapi: 3.2.0
info:
  title: Canny REST Votes API
  description: 'REST API for retrieving and managing Canny customer-feedback resources:

    boards, categories, changelog entries, comments, companies, ideas, posts,

    status changes, tags, users, and votes.'
  version: 1.0.0
  contact:
    name: Canny
    url: https://developers.canny.io/
servers:
- url: https://canny.io/api/v1
  description: Canny v1 base URL
- url: https://canny.io/api/v2
  description: Canny v2 base URL (cursor-paginated endpoints)
security:
- apiKeyBody: []
- apiKeyHeader: []
tags:
- name: Votes
paths:
  /votes/retrieve:
    post:
      tags:
      - Votes
      summary: Retrieve a vote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthedRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericObject'
      operationId: postVotesRetrieve
      x-operation-id-source: derived
  /votes/list:
    post:
      tags:
      - Votes
      summary: List votes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagedAuthedRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericList'
      operationId: postVotesList
      x-operation-id-source: derived
  /votes/create:
    post:
      tags:
      - Votes
      summary: Create a vote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthedRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericObject'
      operationId: postVotesCreate
      x-operation-id-source: derived
  /votes/delete:
    post:
      tags:
      - Votes
      summary: Delete a vote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthedRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericObject'
      operationId: postVotesDelete
      x-operation-id-source: derived
components:
  responses:
    GenericList:
      description: Paginated list response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericList'
    GenericObject:
      description: Single resource response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
  schemas:
    GenericList:
      type: object
      properties:
        hasMore:
          type: boolean
        cursor:
          type: string
      additionalProperties: true
    PagedAuthedRequest:
      allOf:
      - $ref: '#/components/schemas/AuthedRequest'
      - type: object
        properties:
          limit:
            type: integer
            description: Page size limit.
          skip:
            type: integer
            description: v1 skip-based pagination offset.
          cursor:
            type: string
            description: v2 cursor-based pagination token.
    GenericObject:
      type: object
      additionalProperties: true
    AuthedRequest:
      type: object
      required:
      - apiKey
      properties:
        apiKey:
          type: string
          description: Secret API key for the Canny company.
      additionalProperties: true
  securitySchemes:
    apiKeyBody:
      type: apiKey
      in: query
      name: apiKey
      description: 'Secret API key. Canny documents the key as a body parameter named

        `apiKey`; it is modeled here as an `apiKey` security scheme.

        '
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
